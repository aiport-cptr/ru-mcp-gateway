name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Tests (SQLite)
        run: uv run pytest -q
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --frozen --no-dev --no-hashes --no-emit-project)

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rugw
          POSTGRES_PASSWORD: rugw
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rugw" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Tests (PostgreSQL)
        env:
          RUGW_TEST_PG_URL: postgresql+asyncpg://rugw:rugw@127.0.0.1:5432
        run: uv run pytest -q

  install:
    # Репетиция установки по INSTALL.md: deploy/install.sh → check.sh → повторный запуск → backup.sh.
    # Значения OAuth — синтетические; внешний доступ (DNS, сертификат) здесь не проверяется.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -x deploy/*.sh
      - name: Install — first run stops and asks for the Yandex app
        run: |
          set +e
          sudo deploy/install.sh --domain mcp.rugw-ci.ru --admin admin@rugw-ci.ru --proxy external \
            --non-interactive 2>&1 | tee first.log
          test "${PIPESTATUS[0]}" -eq 3
          grep -q RUGW_YANDEX_CLIENT_SECRET first.log
          test "$(sudo stat -c %a .env)" = 600
      - name: Install — second run starts the gateway
        run: |
          sudo bash -c 'source deploy/lib.sh && env_set RUGW_YANDEX_CLIENT_ID synthetic-client \
            && env_set RUGW_YANDEX_CLIENT_SECRET synthetic-secret-value'
          sudo deploy/install.sh --non-interactive 2>&1 | tee second.log
      - name: Re-run is idempotent and secrets are never printed
        run: |
          pw="$(sudo awk -F= '/^POSTGRES_PASSWORD=/ { print $2 }' .env)"
          key="$(sudo awk -F= '/^RUGW_TOKEN_ENCRYPTION_KEYS=/ { print substr($0, index($0, "=") + 1) }' .env)"
          sudo deploy/install.sh --non-interactive 2>&1 | tee third.log
          test "$pw" = "$(sudo awk -F= '/^POSTGRES_PASSWORD=/ { print $2 }' .env)"
          for f in first.log second.log third.log; do
            if grep -qF -e "$pw" -e "$key" -e synthetic-secret-value "$f"; then echo "secret leaked to $f"; exit 1; fi
          done
      - name: Backup
        run: |
          sudo deploy/backup.sh
          sudo sh -c 'test -s backups/rugw-*.dump'
      - name: Logs on failure
        if: failure()
        run: sudo docker compose logs --tail 100
